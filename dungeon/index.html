<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<script src="../lc-bridge.js"></script>
<script src="../lc-assets.js"></script>
<script>
/* 통합 사이트의 라이트/다크 테마를 던전 설정에 미리 반영 (game.js보다 먼저) */
(function(){ var t=document.documentElement.getAttribute('data-lc-theme'); if(!window.LC_EMBED||!t) return;
  try{ var k='lcmd_settings_v1', v=JSON.parse(localStorage.getItem(k)||'{}'); v.theme=t; localStorage.setItem(k,JSON.stringify(v)); }catch(e){}
  document.documentElement.setAttribute('data-theme',t);
  LC_on('theme',function(m){ try{ var k='lcmd_settings_v1', v=JSON.parse(localStorage.getItem(k)||'{}'); v.theme=m.v; localStorage.setItem(k,JSON.stringify(v)); }catch(e){} document.documentElement.setAttribute('data-theme',m.v); });
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lectern Company — 거울 던전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- 공통 질감 레이어 -->
<div class="fx-grain" aria-hidden="true"></div>
<div class="fx-scan" aria-hidden="true"></div>

<div id="app" class="app">
  <!-- 상단 HUD (던전 진행 중에만 보임) -->
  <header id="hud" class="hud" hidden>
    <div class="hud-left">
      <div class="hud-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40"><path d="M8 36V18a12 12 0 0 1 24 0v18" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M20 12l1.4 4.2L26 17.6l-4.6 1.4L20 23.4l-1.4-4.4L14 17.6l4.6-1.4z" fill="currentColor"/><path d="M10 33c3-2 7-2 10 0 3-2 7-2 10 0" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </div>
      <div class="hud-title">
        <span class="mono tiny dim">LECTERN COMPANY · MIRROR DUNGEON</span>
        <strong id="hud-floor" class="serif">FLOOR 1</strong>
      </div>
    </div>
    <div class="hud-mid">
      <div class="hud-an" title="던전 재화 · 안">
        <span class="mono tiny dim">[ AHN ]</span>
        <b id="hud-an">300</b><i>안</i>
      </div>
      <div class="hud-sinbox" title="죄악 재화 (던전 동안 누적)"><span class="mono tiny dim">[ SIN ]</span><div class="hud-sins" id="hud-sins"></div></div>
      <div class="hud-giftbar" id="hud-giftbar">
        <span class="hg-count mono" id="hud-gift-n" title="보유 에고 기프트 수">0</span>
        <button class="hg-arrow l" data-scroll="-1" aria-label="왼쪽으로">‹</button>
        <div class="hud-gifts" id="hud-gifts" data-drag-scroll></div>
        <button class="hg-arrow r" data-scroll="1" aria-label="오른쪽으로">›</button>
      </div>
    </div>
    <nav class="hud-right">
      <button class="hud-btn" data-act="party"><span class="mono tiny">[ P ]</span>파티</button>
      <button class="hud-btn" data-act="gifts"><span class="mono tiny">[ G ]</span>기프트</button>
      <button class="hud-btn" data-act="settings"><span class="mono tiny">[ S ]</span>설정</button>
      <button class="hud-btn" data-act="save-exit"><span class="mono tiny">[ ↵ ]</span>저장 후 나가기</button>
      <button class="hud-btn warn" data-act="abandon"><span class="mono tiny">[ × ]</span>포기</button>
    </nav>
  </header>

  <main id="screen" class="screen"></main>
</div>

<!-- 오버레이 -->
<div id="drawer" class="drawer" hidden></div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<script src="js/data.js?v=136"></script>
  <script src="js/enemies.js?v=136"></script>
  <script src="js/foes.js?v=136"></script>
  <script src="js/fx.js?v=136"></script>
  <script src="js/fx2.js?v=136"></script>
  <script src="js/battle.js?v=136"></script>
<script src="js/game.js?v=136"></script>
</body>
</html>
