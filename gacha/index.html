<!DOCTYPE html>
<html lang="ko">
<head>
<script src="../lc-bridge.js"></script>
<script src="../lc-assets.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lectern Company — 거울 뽑기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500&family=Nanum+Brush+Script&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif:wght@700;900&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E100E; --bg2:#141714; --panel:#181B18; --panel2:#1F231F;
  --line:#2B2F2A; --line2:#3A3F38; --tick:#5A5C55;
  --text:#E9E4D8; --sub:#9A958A; --dim:#6B6860;
  --brass:#B08D57; --brass2:#D4B37A; --green:#2E7D52; --green-d:#043A1E;
  --g1:#F2EEE3; --g2:#E0353F; --g3:#F4C631; --ego:#F28A24; --evt:#2E9A62;
  --serif:'Cormorant Garamond','Noto Serif KR',serif;
  --kserif:'Noto Serif KR',serif;
  --gfont:'Noto Serif','Noto Serif KR',serif;
  --sans:'Noto Sans KR',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --brush:'Nanum Brush Script','Noto Serif KR',serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.07;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1200px 700px at 50% -10%,rgba(46,125,82,.10),transparent 60%),repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line2);border-radius:2px;padding:7px 9px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brass)}
textarea{resize:vertical;width:100%}
.mono{font-family:var(--mono);letter-spacing:.04em}
.hidden{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2a2e29;border-radius:4px}::-webkit-scrollbar-track{background:transparent}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:22px;padding:12px 28px;
  background:linear-gradient(180deg,rgba(14,16,14,.96),rgba(14,16,14,.86));backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:26px;height:32px;color:var(--brass2);flex:none}
.brand b{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.08em;white-space:nowrap}
.brand small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.18em;margin-top:-3px}
nav{display:flex;gap:2px;margin-left:12px}
nav a{display:flex;align-items:baseline;gap:7px;padding:8px 14px;color:var(--sub);text-decoration:none;font-weight:500;border:1px solid transparent;transition:.2s}
nav a i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--dim)}
nav a:hover{color:var(--text)}
nav a.on{color:#0E100E;background:var(--text)}
nav a.on i{color:#55524b}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.wallet{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 10px;border:1px solid var(--line2);background:var(--panel)}
.wallet .ic{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff6a6a,#8a0f18 70%);box-shadow:0 0 10px rgba(224,53,63,.6)}
.wallet .lbl{font-size:11px;color:var(--sub)}
.wallet .val{font-family:var(--mono);font-size:15px;font-weight:500}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line2);color:var(--sub)}
.iconbtn:hover{color:var(--text);border-color:var(--sub)}
.who{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.08em;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

main{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:26px 28px 80px}
.lbl-br{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.notice{margin:0 0 16px;padding:10px 14px;border:1px solid var(--line2);border-left:3px solid var(--brass);background:var(--panel);color:var(--sub);font-size:13px}
.notice.err{border-left-color:var(--g2)}
.notice.prac{border-left-color:var(--sub);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.notice.prac b{color:var(--text)}
.notice .sp{flex:1}
.mode{font-family:var(--mono);font-size:10px;letter-spacing:.18em;padding:4px 8px;border:1px solid var(--line2);color:var(--sub);white-space:nowrap}
.mode.off{border-color:var(--brass);color:var(--brass2);background:rgba(176,141,87,.08)}
.mode.gm{border-color:var(--evt);color:#7fd3a6}
.iconbtn.out{font-size:11px;width:auto;padding:0 10px;font-family:var(--mono);letter-spacing:.1em}
/* 로그인 */
.login{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:radial-gradient(900px 600px at 50% 30%,rgba(46,125,82,.12),transparent 60%),rgba(9,10,9,.96)}
.login .lg{width:min(380px,92vw);border:1px solid var(--line2);background:var(--panel);padding:30px 28px 26px;position:relative}
.login .lg::before,.login .lg::after{content:"";position:absolute;width:16px;height:16px;border:1px solid var(--brass)}
.login .lg::before{left:-1px;top:-1px;border-right:0;border-bottom:0}.login .lg::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.login svg.ar{width:54px;height:70px;color:var(--brass);display:block;margin:0 auto 12px}
.login h2{font-family:var(--serif);font-size:26px;letter-spacing:.06em;text-align:center;margin:0}
.login .sub{text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--dim);margin:4px 0 22px}
.login label{display:block;font-size:11.5px;color:var(--sub);margin:12px 0 5px}
.login .idrow{display:flex;align-items:center;border:1px solid var(--line2);background:var(--bg2)}
.login .idrow input{border:0;background:transparent;flex:1;min-width:0}
.login .idrow span{font-family:var(--mono);font-size:11px;color:var(--dim);padding-right:10px}
.login input{width:100%;padding:10px 12px;background:var(--bg2);border:1px solid var(--line2);color:var(--text);font:inherit;outline:none}
.login input:focus{border-color:var(--brass)}
.login .btn{width:100%;margin-top:20px;padding:11px}
.login .msg{min-height:18px;margin-top:10px;font-size:12px;color:var(--g2);text-align:center}
.login .foot{margin-top:14px;font-size:11px;color:var(--dim);text-align:center;line-height:1.6}
.kv{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.kv label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--sub)}
.kv input{width:100%}
.glist{max-height:220px;overflow:auto;margin-top:10px;border-top:1px solid var(--line)}
.glist .r{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px}
.glist .r b{font-family:var(--mono);min-width:70px;text-align:right}
.glist .r .t{color:var(--dim);font-family:var(--mono);font-size:11px}
.glist .r .nt{flex:1;color:var(--sub)}
td input.ip{width:180px;padding:3px 6px;font-size:11px;font-family:var(--mono)}
@media (max-width:680px){ .kv{grid-template-columns:repeat(2,1fr)} }

/* ---------- gacha page ---------- */
.gacha{display:grid;grid-template-columns:260px 1fr;gap:26px;min-height:calc(100vh - 170px)}
.banners{display:flex;flex-direction:column;gap:10px}
.bn{position:relative;text-align:left;padding:14px 16px 14px 18px;border:1px solid var(--line);background:var(--panel);transition:.25s;overflow:hidden}
.bn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bc,var(--brass));opacity:.35;transition:.25s}
.bn:hover{border-color:var(--line2)}
.bn.on{border-color:var(--bc,var(--brass));background:linear-gradient(90deg,color-mix(in srgb,var(--bc) 14%,transparent),var(--panel) 70%)}
.bn.on::before{opacity:1}
.bn .k{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.16em}
.bn .t{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.04em;margin-top:2px}
.bn .s{font-size:12px;color:var(--sub);margin-top:2px}
.bn.off{opacity:.45;cursor:not-allowed}
.bn .live{position:absolute;right:12px;top:12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;padding:2px 6px;border:1px solid currentColor;color:var(--bc)}
.bn-aside{margin-top:auto;padding:14px 0 0;border-top:1px dashed var(--line2);font-size:12px;color:var(--sub)}
.bn-aside .row{display:flex;justify-content:space-between;padding:3px 0}
.bn-aside .row b{font-family:var(--mono);font-weight:500;color:var(--text)}

.stage{position:relative;border:1px solid var(--line);background:radial-gradient(800px 520px at 50% 40%,color-mix(in srgb,var(--bc) 10%,transparent),transparent 70%),var(--bg2);overflow:hidden;display:flex;flex-direction:column}
.stage .hud{position:absolute;inset:0;pointer-events:none}
.corner{position:absolute;width:22px;height:22px;border-color:var(--tick);border-style:solid}
.corner.tl{left:12px;top:12px;border-width:1px 0 0 1px}.corner.tr{right:12px;top:12px;border-width:1px 1px 0 0}
.corner.bl{left:12px;bottom:12px;border-width:0 0 1px 1px}.corner.br{right:12px;bottom:12px;border-width:0 1px 1px 0}
.hudtxt{position:absolute;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.16em}
.stage-top{position:relative;padding:30px 40px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.stage-top h1{margin:0;font-family:var(--serif);font-size:44px;line-height:1;font-weight:600;letter-spacing:.03em}
.stage-top h1 em{font-style:italic;color:var(--bc)}
.stage-top p{margin:10px 0 0;color:var(--sub);max-width:520px}
.feat{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--line2);font-size:11.5px;color:var(--sub);background:rgba(0,0,0,.25)}
.chip .gd{font-family:var(--gfont)!important;font-family:var(--kserif);font-weight:700}
.mirror-wrap{position:relative;flex:1;display:grid;place-items:center;min-height:420px}
.illu3{position:absolute;left:0;top:0;width:640px;height:940px;transform-origin:0 0;pointer-events:none;opacity:0;transition:opacity .35s ease;z-index:2}
.illu3.on{opacity:1}
.illu3 img{position:absolute;left:46px;top:92px;width:548px;height:648px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 18px 14px rgba(0,0,0,.55))}
.illu3.ego img{left:15px;top:15px;width:610px;height:640px;object-fit:cover;object-position:center 28%;filter:none;-webkit-mask-image:linear-gradient(180deg,#000 62%,transparent 98%);mask-image:linear-gradient(180deg,#000 62%,transparent 98%)}
.illu3.sym img{left:107px;top:132px;width:426px;height:426px;filter:drop-shadow(0 0 26px var(--gc))}
.stage .hero{position:absolute;right:0;bottom:0;top:60px;width:40%;pointer-events:none;z-index:0}
.stage .hero .hs{position:absolute;right:8%;top:6%;width:70%;opacity:.07}
.stage .hero .hi{position:absolute;right:6%;bottom:96px;height:calc(100% - 150px);max-width:92%;object-fit:contain;object-position:right bottom;filter:drop-shadow(0 0 30px color-mix(in srgb,var(--hc) 45%,transparent));-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent 98%);mask-image:linear-gradient(180deg,#000 70%,transparent 98%);animation:heroIn .9s ease-out both}
.stage .hero .ht{position:absolute;right:28px;bottom:104px;text-align:right;display:flex;flex-direction:column;gap:2px;text-shadow:0 2px 10px #000}
.stage .hero .ht span{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--hc)}
.stage .hero .ht b{font-family:var(--kserif);font-size:20px;color:#fff}
.stage .hero .ht em{font-style:normal;font-size:12px;color:#bbb}
.stage .stage-top,.stage .mirror-wrap,.stage .pullbar{position:relative;z-index:1}
@keyframes heroIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@media (max-width:980px){ .stage .hero{width:52%;opacity:.55} .stage .hero .ht{display:none} }
.mirror{position:relative;width:min(330px,60vw);aspect-ratio:200/262;color:var(--bc)}
.mirror svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mirror .glass{fill:url(#glassGrad)}
.mirror .rays{position:absolute;left:-60%;top:-10%;width:120%;height:120%;background:conic-gradient(from 200deg at 100% 30%,transparent 0deg,color-mix(in srgb,var(--bc) 30%,transparent) 8deg,transparent 18deg,color-mix(in srgb,var(--bc) 18%,transparent) 26deg,transparent 34deg);filter:blur(6px);opacity:.55;mix-blend-mode:screen;animation:raySway 9s ease-in-out infinite;pointer-events:none}
@keyframes raySway{50%{opacity:.85;transform:rotate(-2deg)}}
.mirror .s4{transform-origin:100px 98px;animation:spin4 30s linear infinite}
@keyframes spin4{to{transform:rotate(360deg)}}
.mirror .tw{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.orbit{position:absolute;width:min(560px,92%);aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.05)}
.orbit.o2{width:min(450px,76%);border-style:dashed;border-color:rgba(255,255,255,.07);animation:spin4 80s linear infinite reverse}
.orbit svg{width:100%;height:100%;animation:spin4 120s linear infinite}
.pullbar{position:relative;display:flex;align-items:center;gap:14px;padding:18px 26px 26px;justify-content:center;flex-wrap:wrap}
.pbtn{position:relative;min-width:210px;padding:14px 22px 12px;border:1px solid var(--bc);background:linear-gradient(180deg,color-mix(in srgb,var(--bc) 18%,#0e100e),#0e100e);text-align:left;transition:.2s;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.pbtn:hover:not(:disabled){background:linear-gradient(180deg,color-mix(in srgb,var(--bc) 34%,#0e100e),#0e100e);transform:translateY(-1px)}
.pbtn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
.pbtn .a{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--sub)}
.pbtn .b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:.04em;line-height:1.2}
.pbtn .c{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--text)}
.pbtn .c::before{content:"";width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff6a6a,#8a0f18 70%)}
.ghost{padding:9px 14px;border:1px solid var(--line2);color:var(--sub);font-size:12.5px;display:inline-flex;align-items:center;gap:7px}
.ghost:hover{color:var(--text);border-color:var(--sub)}
.ghost.sm{padding:5px 10px;font-size:12px}
.side-tools{display:flex;gap:8px;position:absolute;right:26px;top:30px}

/* ---------- rates modal ---------- */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(5,6,5,.78);backdrop-filter:blur(4px);padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(820px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);position:relative}
.sheet-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
.sheet-h h3{margin:0;font-family:var(--serif);font-size:24px;font-weight:600}
.sheet-b{padding:18px 22px 24px}
.sheet.small{width:min(440px,100%)}
.gtot{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 18px}
.gtot div{padding:10px 12px;border:1px solid var(--line);border-top:2px solid var(--gc);background:var(--bg2)}
.gtot b{font-family:var(--gfont)!important;display:block;font-family:var(--kserif);font-size:17px;color:var(--gc)}
.gtot span{font-family:var(--mono);font-size:16px}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:middle}
th{font-family:var(--mono);font-size:10px;color:var(--dim);font-weight:400;letter-spacing:.12em}
td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.rate-sec{font-family:var(--gfont)!important;margin:16px 0 4px;font-family:var(--kserif);font-weight:700;color:var(--gc);display:flex;justify-content:space-between;align-items:baseline}
.rate-sec span{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--sub)}
.tagup{font-family:var(--mono);font-size:10px;padding:1px 5px;border:1px solid var(--bc,var(--brass));color:var(--bc,var(--brass));margin-left:6px}
.formula{margin-top:18px;padding:12px 14px;background:var(--bg2);border:1px dashed var(--line2);font-size:12.5px;color:var(--sub);line-height:1.7}
.formula b{color:var(--text);font-weight:500}

/* ---------- collection ---------- */
.col-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px;flex-wrap:wrap}
.col-head h2{margin:0;font-family:var(--serif);font-size:40px;font-weight:600;line-height:1}
.col-head .sum{font-family:var(--mono);color:var(--sub);font-size:12px;margin-top:6px}
.chars{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;margin-bottom:6px}
.cchip{flex:none;display:flex;align-items:center;gap:9px;padding:6px 12px 6px 6px;border:1px solid var(--line);background:var(--panel);transition:.2s;min-width:0}
.cchip img{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 0 4px rgba(0,0,0,.6))}
.cchip .nm{font-size:13px;font-weight:500;white-space:nowrap}
.cchip .sh{font-family:var(--mono);font-size:10.5px;color:var(--sub)}
.cchip.all{padding:6px 16px}
.cchip:hover{border-color:var(--line2)}
.cchip.on{border-color:var(--cc,var(--text));background:linear-gradient(180deg,color-mix(in srgb,var(--cc,#fff) 18%,transparent),var(--panel))}
.filters{display:flex;gap:6px;align-items:center}
.seg{display:flex;border:1px solid var(--line2)}
.seg button{padding:6px 12px;font-size:12px;color:var(--sub)}
.seg button.on{background:var(--text);color:#0E100E}
.shardbar{display:flex;align-items:center;gap:16px;padding:14px 18px;border:1px solid var(--line);background:linear-gradient(90deg,color-mix(in srgb,var(--cc) 16%,transparent),var(--panel) 60%);margin-bottom:18px}
.shardbar img{width:54px;height:54px;object-fit:contain}
.shardbar .n{font-family:var(--serif);font-size:26px;font-weight:600}
.shardbar .v{margin-left:auto;text-align:right}
.shardbar .v b{font-family:var(--mono);font-size:26px;font-weight:500}
.shardbar .v small{display:block;font-size:11px;color:var(--sub)}
.gsec{margin:22px 0 10px;display:flex;align-items:center;gap:12px}
.gsec h3{font-family:var(--gfont)!important;margin:0;font-family:var(--kserif);font-size:20px;color:var(--gc)}
.gsec .ln{flex:1;height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--gc) 50%,transparent),transparent)}
.gsec .ct{font-family:var(--mono);font-size:11px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.card{position:relative;aspect-ratio:3/4.4;border:1px solid color-mix(in srgb,var(--gc) 55%,var(--line));background:var(--panel);overflow:hidden;display:flex;flex-direction:column;transition:.2s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.4),0 0 0 1px color-mix(in srgb,var(--gc) 40%,transparent)}
.card .art{position:relative;flex:1;overflow:hidden;background:radial-gradient(120% 80% at 50% 20%,color-mix(in srgb,var(--cc) 38%,#111),#0c0d0c 80%)}
.card .art img.st{position:absolute;left:5%;top:5%;width:90%;height:72%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.card .art::before,.rc .front .art::before{content:'';position:absolute;left:22%;right:22%;top:74.5%;height:4%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.65),transparent);z-index:0}
.card .art img.eg,.rc .front .art img.eg,.zoom .zc .im img.eg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 28%}
.card .art.ego::before,.rc .front .art.ego::before{left:0;right:0;top:0;height:30%;border-radius:0;background:linear-gradient(180deg,rgba(8,9,8,.78),transparent);z-index:1}
.card .art.ego~.gd,.rc .front .art.ego~.gd{z-index:3}
.card .art img.sy{position:absolute;inset:16% 14% 22%;width:72%;height:62%;object-fit:contain;opacity:.92;filter:drop-shadow(0 4px 12px rgba(0,0,0,.6))}
.card .art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 48%,rgba(10,11,10,.7) 66%,rgba(10,11,10,.97) 82%);pointer-events:none}
.card .gd{font-family:var(--gfont)!important;position:absolute;left:8px;top:6px;z-index:2;font-family:var(--kserif);font-weight:900;font-size:18px;color:var(--gc);text-shadow:0 0 10px color-mix(in srgb,var(--gc) 60%,transparent),0 1px 2px #000}
.card .ltd{position:absolute;right:6px;top:7px;z-index:2;font-family:var(--mono);font-size:9px;letter-spacing:.12em;padding:2px 5px;background:var(--green-d);border:1px solid var(--brass);color:var(--brass2)}
.card .ltd.season{background:#1b1410;border-color:var(--brass);color:var(--brass2)}
.card .ltd{letter-spacing:.06em;font-family:var(--sans,inherit);font-size:10px}
.tierc{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;padding:1px 6px;margin-right:6px;border:1px solid var(--tc);color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,rgba(8,9,8,.75));vertical-align:1px}
.card .af .tierc,.rc .af .tierc{font-size:8.5px;padding:0 4px;margin-right:4px}
.card .meta{position:relative;z-index:2;padding:8px 10px 10px;margin-top:-46px}
.card .af{font-size:10.5px;color:var(--sub);line-height:1.3;min-height:14px}
.card .nm{font-family:var(--kserif);font-weight:700;font-size:15px;line-height:1.25}
.card .bar{height:2px;margin-top:7px;background:linear-gradient(90deg,var(--cc),transparent)}
.card.locked .art{filter:grayscale(1) brightness(.38)}
.card.locked .nm,.card.locked .af{opacity:.55}
.card .lock{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;pointer-events:none}
.card .lock svg{width:22px;height:22px;color:var(--sub)}
.card .ex{pointer-events:auto;padding:7px 12px;border:1px solid var(--gc);background:rgba(10,11,10,.85);font-size:12px;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.card .ex small{font-family:var(--mono);font-size:10px;color:var(--sub)}
.card .ex:disabled{border-color:var(--line2);color:var(--dim);cursor:not-allowed}
.card .ex:not(:disabled):hover{background:color-mix(in srgb,var(--gc) 25%,#0a0b0a)}
.card .own{position:absolute;right:7px;bottom:8px;z-index:3;font-family:var(--mono);font-size:9px;color:var(--gc);letter-spacing:.1em}
.empty{padding:40px;text-align:center;color:var(--sub);border:1px dashed var(--line2)}
.log{margin-top:34px}
.log h3{font-family:var(--serif);font-size:24px;margin:0 0 8px;font-weight:600}
.log .row{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.log .row .t{font-family:var(--mono);color:var(--dim);font-size:11px;width:118px;flex:none}
.log .row .bnm{width:70px;flex:none;color:var(--sub)}
.log .row .rs{display:flex;flex-wrap:wrap;gap:4px}
.log .pill{padding:1px 7px;border:1px solid color-mix(in srgb,var(--gc) 50%,var(--line));color:var(--gc);font-size:11.5px}
.log .pill.n{background:color-mix(in srgb,var(--gc) 16%,transparent)}

/* ---------- admin ---------- */
.adm{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.box{border:1px solid var(--line);background:var(--panel);padding:18px 20px}
.box.wide{grid-column:1/-1}
.box h3{margin:0 0 4px;font-family:var(--serif);font-size:24px;font-weight:600}
.box .desc{color:var(--sub);font-size:12.5px;margin:0 0 14px}
.form{display:grid;grid-template-columns:130px 1fr;gap:9px 12px;align-items:center}
.form label{color:var(--sub);font-size:12.5px}
.form .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.form .row2 input[type=number]{width:90px}
.btn{padding:9px 16px;background:var(--text);color:#0E100E;font-weight:700;font-size:13px}
.btn:hover{background:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.br{background:var(--brass);color:#141210}
.btn.red{background:var(--g2);color:#fff}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.parse{margin-top:10px;max-height:240px;overflow:auto;border:1px solid var(--line);font-size:12.5px}
.parse div{display:flex;gap:10px;padding:5px 10px;border-bottom:1px solid var(--line)}
.parse .bad{color:var(--g2)}
.itbl{max-height:520px;overflow:auto;border:1px solid var(--line)}
.itbl td .th{width:34px;height:34px;object-fit:cover;object-position:top;background:#000;border:1px solid var(--line)}
.itbl tr.off td{opacity:.4}
.gb{font-family:var(--gfont)!important;font-family:var(--kserif);font-weight:900;color:var(--gc)}
.tiny{font-size:11.5px;color:var(--sub)}
.sw{display:inline-flex;align-items:center;gap:6px;color:var(--sub);font-size:12.5px;cursor:pointer}
.sw input{accent-color:var(--brass)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;padding:11px 18px;background:#e9e4d8;color:#0e100e;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toast .25s}
.toast.err{background:var(--g2);color:#fff}
@keyframes toast{from{opacity:0;transform:translate(-50%,10px)}}

/* ---------- PULL FX ---------- */
.fx{position:fixed;inset:0;z-index:80;background:#030403;overflow:hidden;--c:#fff;user-select:none}
.fx .skip{position:absolute;right:22px;top:18px;z-index:10;font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:#aaa;padding:8px 14px;border:1px solid #333;background:rgba(0,0,0,.4)}
.fx .skip:hover{color:#fff;border-color:#777}
.fx .scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);z-index:8}
.fx .vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.85));z-index:7}
.fx .layer{position:absolute;inset:0;display:grid;place-items:center}
/* phase A mirror */
.fx .mA{position:relative;width:min(340px,58vw);aspect-ratio:200/262;color:var(--c0,#fff);transition:color .5s}
.fx .mA svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fx .mA .star{opacity:0;transition:opacity .15s}
.fx .mA .star.on{opacity:1}
.fx .glow{position:absolute;inset:-40%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c0,#fff) 55%,transparent),transparent 60%);opacity:0;transition:opacity .6s,background .5s;filter:blur(10px)}
.fx .crack{stroke:var(--c0,#fff);stroke-width:1.3;fill:none;stroke-dasharray:200;stroke-dashoffset:200;transition:stroke-dashoffset .5s ease-out,stroke .5s;filter:drop-shadow(0 0 4px var(--c0,#fff))}
.fx .crack.on{stroke-dashoffset:0}
.fx .beam{position:absolute;left:50%;top:50%;width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--c0) 30%,transparent) 0deg 4deg,transparent 4deg 14deg);mask:radial-gradient(circle,#000 0,transparent 45%);-webkit-mask:radial-gradient(circle,#000 0,transparent 45%);opacity:0;transition:opacity .4s;animation:spin4 14s linear infinite}
.fx .flash{position:absolute;inset:0;background:var(--c0,#fff);opacity:0;pointer-events:none;z-index:6}
.fx .flash.go{animation:flash .9s ease-out forwards}
@keyframes flash{0%{opacity:0}12%{opacity:var(--fo,1)}100%{opacity:0}}
.fx .shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
.fx .hudline{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:#888;white-space:nowrap}
.fx .particles{position:absolute;left:50%;top:50%;width:0;height:0}
.fx .particles i{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--c0);box-shadow:0 0 6px var(--c0);opacity:0}
.fx .particles.go i{animation:pt 1.4s ease-out forwards}
@keyframes pt{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
/* phase B symbol */
.symb{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 46%,color-mix(in srgb,var(--c) 26%,#000),#020202 62%)}
.symb .rings{position:absolute;width:min(78vmin,720px);aspect-ratio:1;color:var(--c);opacity:0;animation:ringIn 1s .1s forwards}
.symb .rings svg{width:100%;height:100%}
.symb .rings .r1{transform-origin:50% 50%;animation:spin4 22s linear infinite}
.symb .rings .r2{transform-origin:50% 50%;animation:spin4 34s linear infinite reverse}
@keyframes ringIn{from{opacity:0;transform:scale(.7)}to{opacity:.85;transform:scale(1)}}
.symb .burst{position:absolute;width:150vmax;height:150vmax;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--c) 22%,transparent) 0 3deg,transparent 3deg 11deg);-webkit-mask:radial-gradient(circle,#000,transparent 50%);mask:radial-gradient(circle,#000,transparent 50%);animation:spin4 24s linear infinite;opacity:.7}
.symb .sym{position:relative;width:min(46vmin,420px);aspect-ratio:1;opacity:0;animation:symIn 1.1s .35s cubic-bezier(.2,.9,.25,1.1) forwards}
.symb .sym img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 22px color-mix(in srgb,var(--c) 70%,transparent)) drop-shadow(0 0 2px #000)}
.symb .sym .gl{position:absolute;inset:0;background-size:contain;background-repeat:no-repeat;background-position:center;mix-blend-mode:screen;opacity:0;animation:glitch 2.2s .9s steps(1) infinite}
.symb .sym .gl.a{filter:drop-shadow(4px 0 0 rgba(255,40,40,.8))}
.symb .sym .gl.b{filter:drop-shadow(-4px 0 0 rgba(40,220,255,.7))}
@keyframes glitch{0%,100%{opacity:0;clip-path:inset(0)}4%{opacity:.8;clip-path:inset(20% 0 60% 0);transform:translateX(-8px)}8%{opacity:.7;clip-path:inset(62% 0 14% 0);transform:translateX(7px)}11%{opacity:0}52%{opacity:.6;clip-path:inset(40% 0 42% 0);transform:translateX(5px)}55%{opacity:0}}
@keyframes symIn{0%{opacity:0;transform:scale(1.6);filter:blur(16px) brightness(3)}60%{opacity:1;filter:blur(0) brightness(1.4)}100%{opacity:1;transform:scale(1);filter:none}}
.symb .gtag{font-family:var(--gfont)!important;position:absolute;top:3.2%;left:50%;transform:translateX(-50%);font-family:var(--kserif);font-weight:900;font-size:clamp(26px,4vw,42px);color:var(--c);letter-spacing:.25em;text-shadow:0 0 20px var(--c);opacity:0;animation:up .7s .9s forwards;white-space:nowrap}
.symb .gtag small{display:block;text-align:center;font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.4em;color:#bbb;text-shadow:none;margin-top:6px}
.symb .cap{position:absolute;bottom:5.5%;left:50%;transform:translateX(-50%);text-align:center;opacity:0;animation:up .8s 1.25s forwards;width:92%}
.symb .cap .cname{font-family:var(--brush);font-size:clamp(46px,7vw,84px);line-height:1;color:#fff;text-shadow:0 0 18px color-mix(in srgb,var(--c) 70%,transparent),0 2px 0 #000;max-width:none}
.symb .cap .what{font-family:var(--kserif);font-weight:700;font-size:clamp(15px,2vw,20px);color:var(--c);margin-top:8px;letter-spacing:.06em}
.symb .cap .slog{font-family:var(--mono);font-size:10.5px;letter-spacing:.35em;color:#888;margin-top:10px}
.symb .hint{position:absolute;bottom:1.4%;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:#666;animation:tw 2s infinite}
@keyframes up{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.symb .ink{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,var(--c),transparent 30%);mix-blend-mode:overlay;opacity:0;animation:ink 1.6s .3s ease-out}
@keyframes ink{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(2.5)}}
/* phase C cards */
.res{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px 24px;background:radial-gradient(1000px 600px at 50% 40%,color-mix(in srgb,var(--c) 12%,#070807),#030403)}
.res .title{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:.12em;margin-bottom:4px}
.res .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.3em;color:#777;margin-bottom:22px}
.rgrid{display:grid;grid-template-columns:repeat(5,minmax(0,150px));gap:14px;perspective:1200px}
.rgrid.one{grid-template-columns:minmax(0,230px)}
.rc{position:relative;aspect-ratio:3/4.4;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.3,.5,1);cursor:pointer}
.rc.flip{transform:rotateY(180deg)}
.rc .fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border:1px solid var(--gc)}
.rc .back{display:grid;place-items:center;background:linear-gradient(160deg,#1a1d1a,#0c0d0c);box-shadow:0 0 18px color-mix(in srgb,var(--gc) 45%,transparent),inset 0 0 30px color-mix(in srgb,var(--gc) 25%,transparent)}
.rc .back svg{width:46%;color:color-mix(in srgb,var(--gc) 75%,#777)}
.rc .back::after{content:"";position:absolute;inset:6px;border:1px solid rgba(255,255,255,.07)}
.rc .front{transform:rotateY(180deg);display:flex;flex-direction:column;background:#111;box-shadow:0 0 26px color-mix(in srgb,var(--gc) 50%,transparent)}
.rc .front .art{position:relative;flex:1;overflow:hidden;background:radial-gradient(120% 80% at 50% 20%,color-mix(in srgb,var(--cc) 40%,#111),#0b0c0b 80%)}
.rc .front .art img.st{position:absolute;left:5%;top:5%;width:90%;height:72%;object-fit:contain;object-position:center bottom;z-index:1}
.rc .front .art img.sy{position:absolute;inset:16% 14% 24%;width:72%;height:60%;object-fit:contain}
.rc .front .art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(8,9,8,.7) 64%,rgba(8,9,8,.97) 82%)}
.rc .front .gd{font-family:var(--gfont)!important;position:absolute;left:8px;top:6px;z-index:2;font-family:var(--kserif);font-weight:900;font-size:17px;color:var(--gc);text-shadow:0 0 10px var(--gc)}
.rc .front .meta{position:relative;z-index:2;margin-top:-48px;padding:0 9px 9px}
.rc .front .af{font-size:10px;color:#aaa;line-height:1.25}
.rc .front .nm{font-family:var(--kserif);font-weight:700;font-size:13.5px;line-height:1.25}
.rc .badge{position:absolute;right:6px;top:7px;z-index:3;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;padding:2px 6px}
.rc .badge.new{background:var(--gc);color:#111;font-weight:500}
.rc .badge.dup{background:rgba(0,0,0,.7);border:1px solid #555;color:#ddd}
.rc.hi .front{animation:hiPulse 1.6s ease-in-out infinite}
@keyframes hiPulse{50%{box-shadow:0 0 44px color-mix(in srgb,var(--gc) 85%,transparent)}}
.res .foot{margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.res .gain{font-size:12.5px;color:#aaa;text-align:center;max-width:780px}
.res .gain b{color:#fff;font-weight:500}
.res .btns{display:flex;gap:10px}
.res .btns button{padding:11px 22px;border:1px solid #555;font-size:13px;letter-spacing:.05em}
.res .btns button.pri{background:#e9e4d8;color:#111;border-color:#e9e4d8;font-weight:700}
.zoom{position:absolute;inset:0;z-index:12;display:grid;place-items:center;background:rgba(0,0,0,.86);animation:fade .2s}
.zoom .zc{display:flex;gap:30px;align-items:center;max-width:900px;padding:20px}
.zoom .zc .im{width:min(340px,40vw);aspect-ratio:3/4.4;position:relative;border:1px solid var(--gc);background:radial-gradient(120% 80% at 50% 20%,color-mix(in srgb,var(--cc) 40%,#111),#0b0c0b 80%);overflow:hidden}
.zoom .zc .im img.st{position:absolute;left:5%;top:4%;width:90%;height:90%;object-fit:contain;object-position:center bottom}
.zoom .zc .im img.sy{position:absolute;inset:18%;width:64%;height:64%;object-fit:contain}
.zoom .gd{font-family:var(--gfont)!important;font-family:var(--kserif);font-weight:900;font-size:30px;color:var(--gc)}
.zoom h4{margin:4px 0 6px;font-family:var(--kserif);font-size:28px}
.zoom .af{color:#aaa}

.intro3{position:absolute;inset:0;z-index:7;display:grid;place-items:center;--ic:#F2EEE3;cursor:pointer;transition:opacity .45s}
.intro3.out{opacity:0}
.intro3 .iglow{position:absolute;width:120vmin;height:120vmin;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ic) 38%,transparent),transparent 58%);opacity:.15;transition:background .35s,opacity .5s;filter:blur(8px)}
.intro3.lit .iglow{opacity:.7}
.intro3 .mA{position:relative;width:min(300px,52vw);aspect-ratio:200/262;color:var(--ic);transition:color .3s;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--ic) 60%,transparent))}
.intro3 .mA svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.intro3 .mA .star{opacity:.12;transition:opacity .15s}
.intro3 .mA .star.on{opacity:1}
.intro3 .crack{stroke:var(--ic);stroke-width:1.3;fill:none;stroke-dasharray:200;stroke-dashoffset:200;transition:stroke-dashoffset .45s ease-out,stroke .3s}
.intro3 .crack.on{stroke-dashoffset:0}
.intro3 .itop{position:absolute;top:calc(50% - min(300px,52vw)*.66 - 70px);left:50%;transform:translate(-50%,10px);opacity:0;transition:.5s;display:flex;align-items:center;gap:12px;white-space:nowrap}
.intro3 .itop b{font-family:var(--gfont);font-weight:900;font-size:clamp(34px,5vw,54px);letter-spacing:.2em;text-shadow:0 0 22px currentColor}
.intro3 .itop .lim{font-family:var(--mono);font-size:13px;letter-spacing:.3em;padding:4px 10px;background:#043A1E;border:1px solid #B08D57;color:#D4B37A;box-shadow:0 0 18px rgba(46,154,98,.6)}
.intro3 .icnt{position:absolute;bottom:calc(50% - min(300px,52vw)*.66 - 62px);left:50%;transform:translate(-50%,-10px);opacity:0;transition:.5s .15s;display:flex;gap:16px;white-space:nowrap}
.intro3 .icnt span{font-family:var(--mono);font-size:15px;color:#ddd;display:flex;align-items:baseline;gap:6px}
.intro3 .icnt i{font-style:normal;font-family:var(--gfont);font-weight:900;font-size:19px;color:var(--gc);text-shadow:0 0 10px var(--gc)}
.intro3.reveal .itop{opacity:1;transform:translate(-50%,0)}
.intro3.reveal .icnt{opacity:1;transform:translate(-50%,0)}
.intro3 .ihint{position:absolute;bottom:22px;right:24px;font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:#666}
.intro3 .shake{animation:shake .45s}
.intro3.txtonly{pointer-events:none;background:none}
.intro3.txtonly .itop{top:3.2%}
.intro3.txtonly .itop b{font-size:clamp(30px,4.2vw,46px);letter-spacing:.35em;text-shadow:0 0 18px currentColor,0 0 2px #000}
.intro3.txtonly .icnt{bottom:2.6%}
.fx3 .stage3{position:absolute;inset:0;cursor:pointer}
.fx3 .stage3 canvas{display:block;width:100%!important;height:100%!important}
.hud3{position:absolute;left:24px;top:20px;z-index:9;font-family:var(--mono);color:#888;letter-spacing:.25em;font-size:11px;pointer-events:none}
.hud3 b{color:#fff;font-weight:500}
.hud3 .dots{display:flex;gap:7px;margin-top:10px}
.hud3 .dots i{width:9px;height:9px;transform:rotate(45deg);border:1px solid #555;transition:.4s}
.hud3 .dots i.on{background:var(--gc);border-color:var(--gc);box-shadow:0 0 10px var(--gc)}
.cap3{position:absolute;left:50%;bottom:3.6%;transform:translate(-50%,14px);z-index:9;text-align:center;opacity:0;transition:opacity .5s,transform .5s;pointer-events:none;width:92%}
.cap3.on{opacity:1;transform:translate(-50%,0)}

/* =========================================================
   확률 계산
   - 가중치: ɵ 5 / ɵɵ 2 / ɵɵɵ 1 / E.G.O. 1  → 항목 수가 늘면 자동 재분배
   - 보유한 E.G.O.는 풀에서 빠지고, 그 가중치는 같은 풀의 ɵɵɵ에 균등 분배
   - 상시: 상시 항목 + (현재 시즌 - 2) 이하 시즌 항목
   - SEASON / 이벤트: 상시 풀 + 이번 픽업 항목, 픽업 항목은 각각 +bonus%p
   ========================================================= */
function inStandard(it){
  if(hiddenItem(it)||isBaseEgo(it)) return false;
  if(it.pool==='standard') return true;
  if(it.pool==='season') return Number(it.season) <= Number(S.cfg.season.no) - 2;
  return false;
}
function featuredFor(banner){
  const all=[...S.items.values()].filter(it=>!hiddenItem(it)&&!isBaseEgo(it));
  if(banner==='season') return all.filter(it=>it.pool==='season' && Number(it.season)===Number(S.cfg.season.no));
  if(banner==='event')  return all.filter(it=>it.pool==='event' && S.cfg.event.tag && it.tag===S.cfg.event.tag);
  return [];
}
function bannerOpen(banner){
  if(banner==='standard') return true;
  if(banner==='season') return !!S.cfg.season.open && featuredFor('season').length>0;
  if(banner==='event') return !!S.cfg.event.open && featuredFor('event').length>0;
  return false;
}
function computeTable(banner,p){
  const all=[...S.items.values()].filter(it=>!hiddenItem(it));
  const feat=featuredFor(banner);
  const featIds=new Set(feat.map(i=>i.id));
  const pool=all.filter(it=>inStandard(it)||featIds.has(it.id));
  const removed=pool.filter(it=>it.grade==='ego' && isOwned(p,it));
  const list=pool.filter(it=>!(it.grade==='ego' && isOwned(p,it)));
  const removedW=removed.reduce((s,it)=>s+GRADES.ego.w,0);
  const n3=list.filter(it=>it.grade==='g3').length;
  const boost3 = n3 ? removedW/n3 : 0;
  const rows=list.map(it=>{
    const w=(GRADES[it.grade]?.w||0) + (it.grade==='g3'?boost3:0);
    return {it, w, feat:featIds.has(it.id)};
  });
  const W=rows.reduce((s,r)=>s+r.w,0);
  if(!W) return {rows:[], W:0, removed, boost3, bonus:0};
  rows.forEach(r=>r.base=r.w/W);
  const bonus = banner==='season' ? (+S.cfg.bonus.season||0)/100 : banner==='event' ? (+S.cfg.bonus.event||0)/100 : 0;
  const F=rows.filter(r=>r.feat), N=rows.filter(r=>!r.feat);
  if(bonus>0 && F.length && N.length){
    const Fp=F.reduce((s,r)=>s+r.base,0);
    let Fq=F.reduce((s,r)=>s+r.base+bonus,0);
    if(Fq>=1){ F.forEach(r=>r.prob=(r.base+bonus)/Fq); N.forEach(r=>r.prob=0); }
    else { F.forEach(r=>r.prob=r.base+bonus); const k=(1-Fq)/(1-Fp); N.forEach(r=>r.prob=r.base*k); }
  } else rows.forEach(r=>r.prob=r.base);
  return {rows, W, removed, boost3, bonus};
}
function drawOne(table){
  const x=rnd(); let acc=0;
  for(const r of table.rows){ acc+=r.prob; if(x<acc) return r.it; }
  return table.rows[table.rows.length-1]?.it;
}

/* =========================================================
   효과음 (WebAudio 합성 — 클릭으로 시작)
   ========================================================= */
let AC=null;
function ac(){ if(S.mute) return null; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){ AC=null; } return AC; }
function tone(f,d=.3,type='sine',g=.12,delay=0,slide){
  const a=ac(); if(!a) return; const t=a.currentTime+delay;
  const o=a.createOscillator(), v=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
  v.gain.setValueAtTime(0,t); v.gain.linearRampToValueAtTime(g,t+.015); v.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(v).connect(a.destination); o.start(t); o.stop(t+d+.05);
}
function noise(d=.6,g=.08,delay=0,hp=800){
  const a=ac(); if(!a) return; const t=a.currentTime+delay;
  const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate), ch=b.getChannelData(0); for(let i=0;i<ch.length;i++) ch[i]=(Math.random()*2-1)*(1-i/ch.length);
  const s=a.createBufferSource(); s.buffer=b; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp;
  const v=a.createGain(); v.gain.value=g; s.connect(f).connect(v).connect(a.destination); s.start(t);
}
const SFX = {
  start(){ noise(1.2,.05,0,300); tone(110,1.4,'sine',.1,0,55); },
  star(i){ tone(880+i*60,.25,'triangle',.05); },
  crack(){ noise(.25,.12,0,2000); tone(1600,.12,'square',.03); },
  burst(g){
    const base={g1:523,g2:440,g3:587,ego:494}[g]||523;
    noise(1,.12,0,500);
    [0,4,7,12].forEach((s,i)=>tone(base*Math.pow(2,s/12),1.6,'triangle',.06,.02*i));
    if(g==='g3'||g==='ego'){ tone(base/2,2.4,'sawtooth',.03); [12,16,19,24].forEach((s,i)=>tone(base*Math.pow(2,s/12),2,'sine',.04,.25+.08*i)); }
  },
  symbol(){ tone(65,2.8,'sine',.18,0,40); noise(1.8,.07,0,1200); [0,7,12,19].forEach((s,i)=>tone(392*Math.pow(2,s/12),2.6,'sine',.045,.4+i*.12)); },
  flip(g){ tone({g1:1300,g2:1100,g3:1500,ego:1400}[g],.08,'triangle',.05); if(g==='g3'||g==='ego') tone(1975,.5,'sine',.05,.03); },
};

/* ---------- 뽑기 실행 ---------- */
async function doPull(n){
  if(S.busy||!S.db||!S.player) return;
  if(!canPullNow()) return toast('공식 뽑기는 셰르 계정에서만 할 수 있습니다',1);
  const banner=S.banner;
  if(!bannerOpen(banner)) return toast('지금은 열려 있지 않은 거울입니다',1);
  const cost = n===10 ? S.cfg.cost.ten : S.cfg.cost.single*n;
  if(balance()<cost) return toast('광기가 부족합니다',1);
  ac(); // 사용자 클릭 안에서 오디오 시작
  S.busy=true;
  const p=normPlayer(S.player);
  const results=[];
  for(let i=0;i<n;i++){
    const tbl=computeTable(banner,p);
    if(!tbl.rows.length) break;
    const it=drawOne(tbl);
    const r={id:it.id, g:it.grade, c:it.char, isNew:false, sh:0};
    if(isOwned(p,it) && it.grade!=='ego'){
      r.sh = +S.cfg.dup[it.grade]||0;
      p.shards[it.char]=(p.shards[it.char]||0)+r.sh;
    } else { p.owned[it.id]={t:Date.now(), v:'pull'}; r.isNew=true; }
    results.push(r);
  }
  if(!results.length){ S.busy=false; return toast('풀이 비어 있습니다',1); }
  const realCost = n===10 && results.length===10 ? cost : S.cfg.cost.single*results.length;
  p.spent=(p.spent||0)+realCost; p.pulls=(p.pulls||0)+results.length;
  p.log=[{t:Date.now(), b:banner, r:results.map(r=>[r.id, r.isNew?1:0, r.sh])}, ...p.log].slice(0,40);
  try{ await savePlayer(p); }
  catch(e){ S.busy=false; render(); return toast(e?.message==='conflict'?'다른 창에서 먼저 기록이 바뀌어 뽑기를 취소했습니다. 다시 시도하세요':'저장하지 못해 뽑기를 취소했습니다 ('+(e?.code||e?.message||'error')+')',1); }
  S.player=p;
  await playFX(results, banner);
  S.busy=false; render();
}

let SKIP=false, NEXT=null;
const sleep = ms => new Promise(r=>{ if(SKIP) return r(); const t=setTimeout(r,ms); NEXT=()=>{clearTimeout(t);r();}; });
async function playFX2D(results, banner){
  SKIP=false;
  const top=results.reduce((m,r)=>GRADES[r.g].rank>GRADES[m].rank?r.g:m,'g1');

      <div class="particles">${Array.from({length:46},()=>{const a=Math.random()*Math.PI*2, d=180+Math.random()*420; return `<i style="--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;animation-delay:${Math.random()*.25}s"></i>`}).join('')}</div>
      <div class="hudline">[ MIRROR-984 · RESONANCE · ${results.length} ]</div>
    </div>
    <div class="flash"></div><div class="vign"></div><div class="scan"></div>
    <button class="skip">SKIP ▸▸</button>`;
  document.body.appendChild(fx);
  fx.querySelector('.skip').onclick=e=>{ e.stopPropagation(); SKIP=true; NEXT&&NEXT(); };
  const mA=fx.querySelector('.mA'), glow=fx.querySelector('.glow'), beam=fx.querySelector('.beam');
  const setC=c=>{ fx.style.setProperty('--c0',c); };
  // 시작 색: 흰빛. ɵɵ 이상이면 붉게, ɵɵɵ/E.G.O.는 붉게 물든 뒤 승급
  setC('#F2EEE3'); SFX.start();
  await sleep(350);
  const stars=[...fx.querySelectorAll('.star')];
  for(let i=0;i<stars.length;i++){ stars[i].classList.add('on'); SFX.star(i); await sleep(Math.max(70,420/stars.length)); }
  glow.style.opacity='.55';
  if(top!=='g1'){ setC(GRADES.g2.hex); }
  await sleep(450);
  fx.querySelectorAll('.crack').forEach((c,i)=>setTimeout(()=>c.classList.add('on'),i*90)); SFX.crack();
  await sleep(520);
  if(top==='g3'||top==='ego'){
    beam.style.opacity='.6'; await sleep(380);
    setC(topHex); mA.classList.add('shake'); SFX.crack(); glow.style.opacity='1';
    await sleep(520);
  } else { beam.style.opacity='.45'; await sleep(300); }
  // 파열
  fx.querySelector('.particles').classList.add('go');
  const fl=fx.querySelector('.flash'); fl.classList.add('go'); SFX.burst(top);
  await sleep(420);
  fx.querySelector('#fxA').remove();

  // B. 심볼 연출
  const specials=results.filter(r=>r.g==='g3'||r.g==='ego');
  for(const r of specials){
    if(SKIP) break;
    await symbolScene(fx,r);
  }
  // C. 카드
  SKIP=false;
  await cardScene(fx,results,banner,top);
}

function cardScene(fx,results,banner,top,fast){
  return new Promise(res=>{
    fx.querySelector('.skip')?.remove();
    const el=document.createElement('div'); el.className='res'; el.style.setProperty('--c',GRADES[top].hex);

    el.innerHTML=`<div class="title">RESONANCE COMPLETE</div><div class="sub">${banner.toUpperCase()} MIRROR · ${results.length} RESULT${one?'':'S'}</div>

    const cards=$$('.rc',el);
    (async()=>{
      await wait(250);
      for(const c of cards){ if(!c.classList.contains('flip')){ c.classList.add('flip'); SFX.flip(results[+c.dataset.i].g); } await wait(fast?40:(one?0:130)); }
    })();

function quadMatrix(W,H,q){

  const den=dx1*dy2-dx2*dy1; if(Math.abs(den)<1e-9) return null;

/* ---------- 도입 연출: 이번 뽑기의 최고 등급 예고 ---------- */
const LECTERN_GLOW='#2E9A62';
function introScene(fx,results,stage){
  return new Promise(async res=>{
    const has=g=>results.some(r=>r.g===g);
    const evt=results.some(r=>S.items.get(r.id)?.pool==='event');
    const top=results.reduce((m,r)=>GRADES[r.g].rank>GRADES[m].rank?r.g:m,'g1');
    const steps=[GRADES.g1.hex];
    if(top!=='g1') steps.push(GRADES.g2.hex);
    if(has('g3')) steps.push(GRADES.g3.hex);
    if(has('ego')) steps.push(GRADES.ego.hex);
    if(evt) steps.push(LECTERN_GLOW);
    const el=document.createElement('div'); el.className='intro3';
    el.innerHTML=`<div class="iglow"></div>
      <div class="mA"><svg viewBox="0 0 200 262">
        <path d="M22 256V104a78 78 0 0 1 156 0v152z" fill="rgba(255,255,255,.035)"/>
        <path d="M22 256V104a78 78 0 0 1 156 0v152" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <path d="M34 256V106a66 66 0 0 1 132 0v150" fill="none" stroke="currentColor" stroke-width=".8" opacity=".5"/>
        ${starsSVG(results.length)}
        <path class="crack" d="M100 98 L88 120 L96 138 L78 170 L86 196"/><path class="crack" d="M100 98 L118 116 L110 140 L132 168"/>
        <path class="crack" d="M100 98 L72 92 L52 110"/><path class="crack" d="M100 98 L126 84 L150 96 L162 88"/>
        <path d="M40 226q30-14 60 2 30-16 60-2v20q-30-14-60 2-30-16-60-2z" fill="#030403" stroke="currentColor" stroke-width="1.6"/>
      </svg></div>
      <div class="itop"></div><div class="icnt"></div><div class="ihint">CLICK ▸ SKIP INTRO</div>`;
    fx.insertBefore(el, fx.querySelector('.flash'));
    const fl=fx.querySelector('.flash');
    const flash=(col,o)=>{ fl.style.setProperty('--c0',col); fl.style.setProperty('--fo',o); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go'); };
    let fast=false, wake=null;
    const sl=ms=>new Promise(r=>{ if(fast||SKIP) return r(); const t=setTimeout(r,ms); wake=()=>{clearTimeout(t);r();}; });
    el.onclick=e=>{ e.stopPropagation(); fast=true; wake&&wake(); };
    const setC=c=>{ el.style.setProperty('--ic',c); stage&&stage.setIdle(c); };
    setC(steps[0]); SFX.start();
    await sl(250);
    const stars=$$('.star',el);
    for(let i=0;i<stars.length;i++){ stars[i].classList.add('on'); SFX.star(i); await sl(Math.max(55,380/stars.length)); }
    el.classList.add('lit'); await sl(380);
    const cracks=$$('.crack',el);
    for(let k=1;k<steps.length;k++){
      await sl(k===1?260:430);
      setC(steps[k]); flash(steps[k], k===steps.length-1?.7:.45);
      const m=$('.mA',el); m.classList.remove('shake'); void m.offsetWidth; m.classList.add('shake');
      cracks.slice(0,Math.ceil(cracks.length*k/(steps.length-1))).forEach(c=>c.classList.add('on'));
      SFX.crack(); if(k===steps.length-1) SFX.burst(top);
    }
    if(steps.length===1){ await sl(200); SFX.burst('g1'); }
    // 최고 등급 + 등급별 개수
    const last=steps[steps.length-1];
    $('.itop',el).innerHTML = evt
      ? `<span class="lim">LIMITED</span><b style="color:${GRADES[top].hex}">${esc(GRADES[top].label)}</b>`
      : `<b style="color:${GRADES[top].hex}">${esc(GRADES[top].label)}</b>`;

      + (evt?`<span style="--gc:${LECTERN_GLOW}"><i>LIMITED</i>×${results.filter(r=>S.items.get(r.id)?.pool==='event').length}</span>`:'');
    el.classList.add('reveal');
    await sl(fast?250:1500);

    + (evt?`<span style="--gc:${LECTERN_GLOW}"><i>LIMITED</i>×${results.filter(r=>S.items.get(r.id)?.pool==='event').length}</span>`:'');

/* ---------- 3D 뽑기 진행 ---------- */
async function playFX(results, banner){
  let ok=false; try{ ok=await Promise.race([FX3D.load(), wait(6000).then(()=>false)]) && FX3D.ok(); }catch(e){ ok=false; }
  if(!ok) return playFX2D(results, banner);
  SKIP=false;
  const top=results.reduce((m,r)=>GRADES[r.g].rank>GRADES[m].rank?r.g:m,'g1');
  const n=results.length;
  const fx=document.createElement('div'); fx.className='fx fx3';
  fx.innerHTML=`<div class="stage3"></div>
    <div class="hud3"><div class="cnt">RESONANCE <b>01</b> / ${String(n).padStart(2,'0')}</div>
      <div class="dots">${results.map(()=>'<i></i>').join('')}</div></div>
    <div class="cap3"></div><div class="hint3"></div>
    <div class="flash"></div><div class="vign"></div><div class="scan"></div>
    <button class="skip">SKIP ALL ▸▸</button>`;
  document.body.appendChild(fx);
  const host=$('.stage3',fx), cap=$('.cap3',fx), hint=$('.hint3',fx), fl=$('.flash',fx);
  let stage=null;
  try{ stage=createStage(host, banner); }catch(e){ fx.remove(); return playFX2D(results, banner); }
  const flash=(col,o)=>{ fl.style.setProperty('--c0',col); fl.style.setProperty('--fo',o); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go'); };
  const tap=()=>{ if(document.querySelector('.symb')) return; stage.tap(); };
  host.addEventListener('click',tap);
  const onKey=e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); tap(); } else if(e.key==='Escape'){ SKIP=true; stage.stop(); } };
  window.addEventListener('keydown',onKey);
  $('.skip',fx).onclick=e=>{ e.stopPropagation(); SKIP=true; NEXT&&NEXT(); stage.stop(); };
  // 텍스처 미리 준비 + 도입 연출
  const texP=results.map(r=>drawCardCanvas(r));
  if(banner!=='exchange'){
    hint.textContent='CLICK ▸ FAST FORWARD';
    await stage.intro(introInfo(results),{flash});
  }
  for(let i=0;i<n;i++){
    if(SKIP) break;
    const r=results[i], G=GRADES[r.g], it=S.items.get(r.id)||{name:'?',char:r.c}, c=CH[it.char]||{name:''};
    $('.cnt b',fx).textContent=String(i+1).padStart(2,'0');
    cap.classList.remove('on'); hint.textContent='CLICK ▸ FAST FORWARD';
    const tex=await texP[i];
    if(SKIP) break;
    const offIllu = tex._illu ? illuOverlay(host,stage,tex._illu) : null;
    await stage.play(r,tex,{
      flash,
      onSymbol:()=>symbolScene(fx,r),
      onReveal:()=>{
        const kc=cardCol(it,r.g);
        const dot=$$('.dots i',fx)[i]; dot.style.setProperty('--gc',kc); dot.classList.add('on');
        cap.style.setProperty('--gc',kc);
        cap.innerHTML=`<div class="g">${esc(G.label)}</div><div class="n">${esc(it.name)}</div><div class="o">${esc(c.name)} · ${r.isNew?'<b>NEW</b>':'중복 → 파편 +'+r.sh}</div>`;
        requestAnimationFrame(()=>cap.classList.add('on'));
      },
      onHold:()=>{ hint.textContent= i<n-1 ? 'CLICK ▸ NEXT' : 'CLICK ▸ RESULT'; },
    });
    offIllu&&offIllu();
    if(stage.failed) break;
  }
  window.removeEventListener('keydown',onKey);
  stage.dispose(); host.remove(); cap.remove(); hint.remove(); $('.hud3',fx)?.remove();
  SKIP=false;
  await cardScene(fx,results,banner,top,true);
}

async function doExchange(id){
  const it=S.items.get(id); if(!it||hiddenItem(it)||S.busy||!S.player) return;
  if(!canPullNow()) return toast('공식 기록의 교환은 셰르 계정에서만 할 수 있습니다',1);
  const price=+S.cfg.exchange[it.grade]; const p=normPlayer(S.player);
  if(isOwned(p,it)) return toast('이미 보유 중입니다',1);
  if((p.shards[it.char]||0)<price) return toast('파편이 부족합니다',1);
  S.busy=true; ac();
  p.shards[it.char]-=price; p.owned[it.id]={t:Date.now(),v:'exchange'};
  p.log=[{t:Date.now(), b:'exchange', r:[[it.id,1,0]]}, ...p.log].slice(0,40);
  try{ await savePlayer(p); S.player=p; }
  catch(e){ S.busy=false; render(); return toast('교환을 저장하지 못했습니다',1); }
  const r={id:it.id,g:it.grade,c:it.char,isNew:true,sh:0};
  await playFX([r],'exchange');
  S.busy=false; render();
}

const GRADE_TOKENS=[['zayin','ego:zayin'],['teth','ego:teth'],['he','ego:he'],['waw','ego:waw'],['aleph','ego:aleph'],['ɵɵɵ','g3'],['ɵɵ','g2'],['ɵ','g1'],['e.g.o.','ego'],['e.g.o','ego'],['ego','ego'],['에고','ego'],['000','g3'],['00','g2'],['0','g1']];
function parseBulk(text){
  return text.split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
    let g=null, rest=line;
    for(const [tk,gv] of GRADE_TOKENS){ if(rest.toLowerCase().startsWith(tk+' ')||rest.toLowerCase().startsWith(tk+'\t')){ g=gv; rest=rest.slice(tk.length).trim(); break; } }
    let char=null, name=rest;
    if(rest.includes('|')){ const [a,b]=rest.split('|'); name=a.trim(); const k=b.trim(); const f=CHARS.find(c=>c.keys.some(x=>x===k)||c.name===k||c.short===k||c.id===k.padStart(2,'0')); char=f?.id||null; }
    else { let best=null; for(const c of CHARS) for(const k of c.keys){ if(name.endsWith(k) && (!best||k.length>best.k.length)) best={id:c.id,k}; } char=best?.id||null; }
    let tier=''; if(g&&g.startsWith('ego:')){ tier=g.slice(4); g='ego'; }
    return {line, g, tier, name, char, ok:!!(g&&name&&char)};
  });
}

let _migBusy=false;
async function runMigrations(){
  if(_migBusy || !S.db || !S.official || !(S.isMainGM||S.isSher)) return;
  const todo=OFFICIAL_MIGRATIONS.filter(m=>!(S.official.mig&&S.official.mig[m.key]));
  if(!todo.length) return;
  _migBusy=true;
  try{ await editOfficial(p=>{ p.mig=p.mig||{}; todo.forEach(m=>{ if(p.mig[m.key]) return; m.add.forEach(id=>{ if(!p.owned[id]) p.owned[id]={t:Date.now(),v:'migrated'}; }); p.mig[m.key]=true; }); }); }
  catch(e){ console.warn('migration',e); }
  _migBusy=false;
}
async function editOfficial(fn){
  const res=await S.db.ref('gacha/official').transaction(cur=>{ if(!cur) return; const p=normPlayer(cur); fn(p); p.rev=(p.rev||0)+1; return p; });
  if(!res.committed) throw new Error('no-official');
}

    catch(e){ toast('지급 실패 ('+(e.code||e.message)+')',1); }
  };
  $$('[data-ungrant]').forEach(b=>b.onclick=async()=>{ try{ await S.db.ref('gacha/grants/'+b.dataset.ungrant).remove(); toast('지급을 취소했습니다'); }catch(e){ toast('실패',1); } });
  $('#shSave').onclick=async()=>{
    const v={}; $$('[data-sh]').forEach(i=>v[i.dataset.sh]=Math.max(0,Math.round(Number(i.value)||0)));
    try{ await editOfficial(p=>{ p.shards=v; }); toast('파편을 저장했습니다'); }catch(e){ toast('저장 실패 ('+(e.code||e.message)+')',1); }
  };
  $$('[data-sown]').forEach(b=>b.onchange=async()=>{
    const id=b.dataset.sown, on=b.checked;
    try{ await editOfficial(p=>{ if(on) p.owned[id]={t:Date.now(),v:'gm'}; else delete p.owned[id]; }); }catch(e){ b.checked=!on; toast('실패 ('+(e.code||e.message)+')',1); }
  });
  $('#cfgSave').onclick=async()=>{
    const c=structuredClone(S.cfg);
    $$('#cfgForm [name]').forEach(inp=>{
      const path=inp.name.split('.'); let o=c; for(let i=0;i<path.length-1;i++) o=o[path[i]]=o[path[i]]||{};
      const k=path[path.length-1];
      o[k]= inp.type==='checkbox'?inp.checked : inp.type==='number'?Number(inp.value): inp.value.trim();
    });
    try{ await S.db.ref('gacha/config').set(c); toast('설정을 저장했습니다'); }catch(e){ toast('저장 실패 ('+(e.code||e.message)+')',1); }
  };
  const bulk=$('#bulk'), out=$('#parse'), addB=$('#bulkAdd');
  const upd=()=>{ const r=parseBulk(bulk.value); out.innerHTML=r.map(x=>`<div class="${x.ok?'':'bad'}"><span class="gb" style="--gc:${x.g?GRADES[x.g].color:'var(--g2)'};width:44px">${x.g?GRADES[x.g].label:'등급?'}</span><span style="flex:1">${esc(x.name)}${x.tier?` <span class="tiny">${EGO_TIERS[x.tier]}</span>`:''}</span><span class="tiny">${x.char?esc(CH[x.char].short):'캐릭터?'}</span></div>`).join(''); addB.disabled=!r.length||r.some(x=>!x.ok); addB.textContent=r.length?`${r.length}개 추가하기`:'추가하기'; };
  bulk.oninput=upd; upd();
  addB.onclick=async()=>{
    const r=parseBulk(bulk.value); if(!r.length||r.some(x=>!x.ok)) return;
    const pool=$('#bPool').value, season=Number($('#bSeason').value)||S.cfg.season.no, tag=$('#bTag').value.trim();
    const upd={}; const base=Date.now();
    r.forEach((x,i)=>{ const id=newId(x.g); const doc={name:x.name, char:x.char, grade:x.g, pool, created:base+i}; if(x.tier) doc.tier=x.tier;
      if(pool==='season') doc.season=season; if(pool==='event') doc.tag=tag; upd[id]=doc; });
    addB.disabled=true;
    try{ await S.db.ref('gacha/items').update(upd); toast(`${r.length}개를 추가했습니다`); bulk.value=''; }catch(e){ toast('추가 실패 ('+(e.code||e.message)+')',1); addB.disabled=false; }
  };
  const itemSet=(id,k,v)=>S.db.ref(`gacha/items/${id}/${k}`).set(v).catch(e=>toast('실패 ('+(e.code||e.message)+')',1));
  $$('[data-off]').forEach(b=>b.onclick=()=>{ const it=S.items.get(b.dataset.off); itemSet(it.id,'off',it.off?null:true); });
  $$('[data-tier]').forEach(b=>b.onchange=()=>itemSet(b.dataset.tier,'tier',b.value||null));
  $$('[data-base]').forEach(b=>b.onchange=()=>{ itemSet(b.dataset.base,'base',b.checked?true:null); toast(b.checked?'기본 E.G.O. — 모두 보유, 뽑기에서 제외':'뽑기 E.G.O.로 바꿨습니다'); });
  $$('[data-noex]').forEach(b=>b.onchange=()=>itemSet(b.dataset.noex,'noEx',b.checked?null:true));
  $$('[data-imgp]').forEach(b=>b.onchange=()=>{ itemSet(b.dataset.imgp,'img',b.value.trim()||null); toast('이미지 경로를 바꿨습니다'); });
  $$('[data-imgup]').forEach(b=>b.onclick=async()=>{
    const it=S.items.get(b.dataset.imgup); if(!it||!window.LC_ASSET) return;
    const f=await LC_ASSET.pick(); if(!f) return;
    const kind = it.grade==='ego' ? 'ego' : 'identity';
    b.disabled=true; b.textContent='…';
    try{ const r=await LC_ASSET.upload(f,{kind, id:it.id.replace(/[^a-z0-9_-]/gi,'-').toLowerCase(), name:it.name}); await itemSet(it.id,'img',r.ref); toast('이미지를 올렸습니다 — '+r.ref); }
    catch(e){ toast('올리지 못했습니다 ('+(e.code||e.message)+')',1); }
    b.disabled=false; b.textContent='올리기';
  });
  $$('[data-del]').forEach(b=>b.onclick=()=>{
    const it=S.items.get(b.dataset.del); const el=document.createElement('div'); el.className='modal';
    el.innerHTML=`<div class="sheet small"><div class="sheet-h"><h3>항목 삭제</h3></div><div class="sheet-b"><p>「${esc(it.name)}」을(를) 완전히 지웁니다. 셰르의 보유 기록에서도 보이지 않게 됩니다. 숨기기만 하려면 '끄기'를 쓰세요.${(window.LC_CATALOG||[]).some(x=>x.id===it.id)?'<br><span class="tiny">카탈로그 파일에 있는 항목이라 「카탈로그 동기화」를 누르면 다시 생깁니다.</span>':''}</p><div class="actions"><button class="ghost" data-x>취소</button><button class="btn red" data-ok>삭제</button></div></div></div>`;
    el.onclick=async e=>{ if(e.target===el||e.target.closest('[data-x]')) return el.remove(); if(e.target.closest('[data-ok]')){ el.remove(); try{ await S.db.ref('gacha/items/'+it.id).remove(); toast('삭제했습니다'); }catch(err){toast('실패',1)} } };
    document.body.appendChild(el);
  });
}

/* =========================================================
   라우팅 / 로그인 / 데이터 연결 (Firebase Realtime Database)
   ========================================================= */
function route(){ const h=(location.hash||'#gacha').slice(1); S.view=['gacha','collection','admin'].includes(h)?h:'gacha'; render(); }
window.addEventListener('hashchange',route);

let rT=null; function rerender(){ if(document.querySelector('.fx')) return; clearTimeout(rT); rT=setTimeout(()=>{ if(!document.querySelector('.modal')) render(); else { $('#madness').textContent=S.player?fmt(balance()):'—'; } },60); }

const subs=[];
function off(){ while(subs.length) subs.pop()(); }
function listen(path, cb, onErr){ const ref=S.db.ref(path); const h=ref.on('value', cb, onErr||(()=>{})); subs.push(()=>ref.off('value',h)); }

function detectSher(){
  const pr=S.profile||{}; const ch=pr.chars||{};
  const byProfile = ch.no10===true;
  const byCfg = !!(S.cfg.sherUid && S.cfg.sherUid===S.uid);
  return byProfile || byCfg;
}
function applyRole(){
  S.isMainGM = S.uid===MAIN_GM || S.profile?.main===true;
  S.isAdmin = S.isMainGM;
  const wasSher=S.isSher; S.isSher=detectSher();
  if(S.isSher){ if(S.mode!=='official') setMode('official'); }
  else if(wasSher || !S.player){ setMode('practice'); }
  renderTag();
  const nm = S.profile?.label || S.loginId;
  $('#who').textContent = nm + (S.isSher?' · 관리자':S.isMainGM?' · 메인 GM':'');
}

function showLogin(on){ $('#login').classList.toggle('hidden',!on); $('#outBtn').classList.toggle('hidden',on); if(on) setTimeout(()=>$('#lgId').focus(),50); }
$('#loginForm').onsubmit=async e=>{
  e.preventDefault(); const id=$('#lgId').value.trim(), pw=$('#lgPw').value; const msg=$('#lgMsg'); msg.textContent='';
  if(!id||!pw) return; $('#lgBtn').disabled=true; $('#lgBtn').textContent='접속 중…';
  try{ await firebase.auth().signInWithEmailAndPassword(id.includes('@')?id:id+ID_DOMAIN, pw); $('#lgPw').value=''; }
  catch(err){ const c=err.code||''; msg.textContent = c.includes('invalid')||c.includes('wrong-password')||c.includes('user-not-found') ? '아이디 또는 비밀번호가 맞지 않습니다' : c.includes('too-many') ? '시도가 너무 많습니다. 잠시 후 다시 시도하세요' : '접속하지 못했습니다 ('+c+')'; }
  $('#lgBtn').disabled=false; $('#lgBtn').textContent='접속';
};
$('#outBtn').onclick=()=>{ if(S.busy) return; firebase.auth().signOut(); };

function onSignedIn(user){
  S.uid=user.uid; S.loginId=(user.email||'').replace(ID_DOMAIN,''); S.err=null;
  S.practice=loadPractice(); if(!S.practice){ S.practice=freshPlayer(); storePractice(S.practice); }
  setMode('practice');
  showLogin(false); applyRole(); route();
  const timer=setTimeout(()=>{ if(!S.itemsReady){ S.err='데이터를 아직 불러오지 못했습니다. 보안 규칙에 gacha 경로가 들어갔는지 확인해 주세요.'; render(); } },10000);

  listen('users/'+S.uid, s=>{ S.profile=s.val()||null; applyRole(); rerender(); });
  listen('gacha/config', s=>{ S.cfgRaw=s.val(); S.cfg=deepMerge(DEFAULT_CFG, S.cfgRaw||{}); applyRole(); rerender(); }, e=>{ S.err='설정을 읽을 수 없습니다 ('+e.code+') — 보안 규칙을 확인하세요'; render(); });
  listen('gacha/items', s=>{
    const v=s.val()||{}; S.items=new Map(Object.entries(v).map(([id,d])=>[id,{id,...d}]));
    (window.LC_CATALOG||[]).forEach(x=>{ const it=S.items.get(x.id); if(!it) return;
      ['pool','season','tag','tier','base','unreleased'].forEach(k=>{ if(x[k]===undefined){ if(k==='season'||k==='tag'||k==='unreleased') delete it[k]; } else it[k]=x[k]; }); });
    S.itemsReady=true; clearTimeout(timer); if(S.err&&S.err.startsWith('데이터를')) S.err=null; rerender();
  }, e=>{ clearTimeout(timer); S.err='항목을 읽을 수 없습니다 ('+e.code+') — 보안 규칙에 gacha 경로를 추가해야 합니다'; render(); });
  listen('gacha/official', s=>{
    S.official=normPlayer(s.val()); S.officialReady=true;
    if(S.mode==='official' && !S.busy) S.player=S.official;
    runMigrations();
    if(S.isSher && S.mode!=='official') setMode('official');
    rerender();
  });
  listen('gacha/grants', s=>{
    const v=s.val()||{}; S.grants=Object.entries(v).map(([id,g])=>({id,...g})); S.grantSum=S.grants.reduce((a,g)=>a+(Number(g.amt)||0),0); rerender();
  });
}
function onSignedOut(){
  off(); S.uid=null; S.profile=null; S.isSher=S.isMainGM=S.isAdmin=false; S.official=null; S.practice=null; S.player=null; S.items=new Map(); S.itemsReady=false; S.grants=[]; S.grantSum=0;
  $('#who').textContent=''; renderTag(); showLogin(true); render();
}

function boot(){
  route();
  if(!window.firebase){ S.err='Firebase를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.'; render(); return; }
  if(!window.LC_CATALOG){ S.err='catalog.js를 찾지 못했습니다. index.html과 같은 폴더에 있어야 합니다.'; render(); return; }
  firebase.initializeApp(FB_CONFIG);
  S.db=firebase.database();
  firebase.auth().onAuthStateChanged(u=>{ off(); if(u) onSignedIn(u); else onSignedOut(); });
}
boot();
setTimeout(()=>{ FX3D.load(); },1200);
</script>
<script>
/* 통합 사이트 연결 (lc-bridge) — 왼쪽 위 상호를 누르면 로비로 */
if(window.LC_EMBED){ const b=document.querySelector('header .brand'); if(b){ b.title='로비로'; b.onclick=()=>LC_post({type:'go',to:'lobby'}); } }
</script>
